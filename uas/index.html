<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Elektronik</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h2>ElectroStore</h2>
</header>

<div class="banner">
    <img src="img/banner.jpg" alt="Banner">
</div>

<section class="kategori">

    <h3>Kategori</h3>

    <div class="grid">

        <div class="card">
            <img src="img/hp.jpg" alt="Smartphone">
            <p>Smartphone</p>
        </div>

        <div class="card">
            <img src="img/laptop.jpg" alt="Laptop">
            <p>Laptop</p>
        </div>

        <div class="card">
            <img src="img/headset.jpg" alt="Headset">
            <p>Headset</p>
        </div>

        <div class="card">
            <img src="img/tablet.jpg" alt="Tablet">
            <p>Tablet</p>
        </div>

    </div>

</section>

<section class="produk">

    <h3>Produk Terbaru</h3>

    <div class="produk-card">
        <img src="img/laptop.jpg" alt="Laptop ASUS">
        <h4>Laptop ASUS</h4>
        <p>Rp12.000.000</p>
        <button>Beli</button>
    </div>

    <div class="produk-card">
        <img src="img/hp.jpg" alt="Samsung S25">
        <h4>Samsung S25</h4>
        <p>Rp15.000.000</p>
        <button>Beli</button>
    </div>

</section>

<nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="dashboard.html">Dashboard</a>
</nav>

</body>
</html>
