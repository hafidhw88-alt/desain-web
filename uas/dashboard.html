<!DOCTYPE html>
<html lang="id">
<head>

    <title>Dashboard - ElectroStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <a href="index.html" class="back-btn">&#8592;</a>
